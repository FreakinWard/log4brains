on:
  workflow_call:
    inputs:
      only-changed-packages:
        required: false
        type: boolean
        default: false # by default it will test all packages; also if only-changed-packages=true and package-lock.json has changed: it will test all packages too
      experimental:
        required: false
        type: boolean
        default: false
      os:
        required: true
        type: string
      # Set only one of these two inputs:
      node-version:
        required: false
        type: string
      node-version-file:
        required: false
        type: string

defaults:
  run:
    shell: bash

jobs:
  tests:
    runs-on: ${{ inputs.os }}
    continue-on-error: ${{ inputs.experimental }}
    env:
      # .npmrc sets engine-strict=true; best-effort jobs test upcoming Node versions outside the supported range
      npm_config_engine_strict: ${{ !inputs.experimental }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # fetch all history to make Jest snapshot tests work
      - uses: actions/setup-node@v7
        with:
          node-version-file: ${{ inputs.node-version-file }}
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci

      - name: Check for package-lock.json changes
        id: lockfile
        # Sets an output instead of failing the step, so no error annotation is emitted
        run: |
          if git diff --quiet origin/develop HEAD -- package-lock.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # We have to build all the packages before the tests
      # Because init-log4brains's integration tests use @awarded/log4brains-cli, which uses @awarded/log4brains-core
      # TODO: we should separate tests that require built packages of the others, to get a quicker feedback
      # Once it's done, we should add "npm test" in each package's preVersion script
      - run: npm run build

      - name: Test only packages that have changed compared to the main branch
        if: ${{ inputs.only-changed-packages && steps.lockfile.outputs.changed == 'false' }}
        run: npm test -- --since origin/develop

      - name: Test all packages (only-changed-packages=false or package-lock.json has changed)
        if: ${{ !inputs.only-changed-packages || steps.lockfile.outputs.changed == 'true' }}
        run: npm test

      - name: E2E tests
        run: |
          npm run link-cli
          # npm's global bin directory: <prefix>/bin, except on Windows where it is <prefix>
          echo "$(npm prefix -g)$([ "$RUNNER_OS" = "Windows" ] || echo /bin)" >> "$GITHUB_PATH"
          # Production-like install: no devDependencies and no lockfile, like `npm install -g` for users
          rm -rf node_modules
          npm install --omit=dev --no-package-lock --no-audit --no-fund
          npm run e2e
