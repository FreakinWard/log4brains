# Release pipeline: Build -> Beta -> Release, one run per merge to develop (like Azure DevOps stages).
# Each stage is a reusable workflow (stage-*.yml) that holds every job needed to complete it, so the run's
# sidebar lists the stages and each stage can be re-run from the run page.
#
# Dry run: until the repository variable RELEASES_ENABLED is "true", and always on branches other than
# develop, Beta and Release publish nothing, tag nothing and deploy nothing. Their e2e tests and Docker
# build install the packages from a throwaway local npm registry instead.
name: Release pipeline

on:
  push:
    branches: [develop]
    paths:
      - "packages/**"
      - "e2e-tests/**"
      - "docker/**"
      - "package.json"
      - "package-lock.json"
      - "lerna.json"
      - ".nvmrc"
      - ".github/**"
  workflow_dispatch:
    inputs:
      deployment:
        description: Which stages run
        type: choice
        default: full-ci
        options: [no-deployment, beta-only, full-ci]

# Concurrency is per stage, not per run, so an approval waiting in Release never holds up the next merge:
# - Beta: like Azure's `trigger: batch: true`. A running Beta is never cancelled, and merges that arrive
#   meanwhile collapse into one queued Beta for the latest of them.
# - Release: one at a time. A waiting approval holds it for at most the 1-minute timeout, and Publish
#   refuses any commit that isn't the branch's latest, so only the newest merge can be released.
# Build has no limit: it only tests and packs, and each run gets its own version.

permissions:
  contents: read

jobs:
  build:
    name: Build
    uses: ./.github/workflows/stage-build.yml
    secrets: inherit

  beta:
    name: Beta
    needs: build
    if: github.event_name == 'push' || inputs.deployment != 'no-deployment'
    concurrency:
      group: release-pipeline-beta-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write # git tag
      id-token: write # npm trusted publishing
    uses: ./.github/workflows/stage-beta.yml
    with:
      version: ${{ needs.build.outputs.beta }}
      stable: ${{ needs.build.outputs.stable }}
      dry-run: ${{ vars.RELEASES_ENABLED != 'true' || github.ref != 'refs/heads/develop' }}
    secrets: inherit

  release:
    name: Release
    needs: beta
    if: github.event_name == 'push' || inputs.deployment == 'full-ci'
    concurrency:
      group: release-pipeline-release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write # git tag + GitHub Release
      id-token: write # npm trusted publishing + GitHub Pages
      pages: write
    uses: ./.github/workflows/stage-release.yml
    with:
      version: ${{ needs.beta.outputs.stable }}
      dry-run: ${{ vars.RELEASES_ENABLED != 'true' || github.ref != 'refs/heads/develop' }}
    secrets: inherit

  # Like Azure's ManualValidation@0 with timeoutInMinutes: 1 and onTimeout: reject. It sits beside the
  # Release stage because it has to run while that stage waits. If Release is still waiting for approval
  # after 1 minute, the run is cancelled so it doesn't hold up the next release. It runs on every attempt:
  # to release later, use "Re-run failed jobs" on the run and approve within a minute.
  release-timeout:
    name: Release timeout
    needs: beta
    if: github.event_name == 'push' || inputs.deployment == 'full-ci'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      RUN: repos/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Wait for the approval request
        id: request
        run: |
          for _ in $(seq 1 60); do
            pending=$(gh api "$RUN/pending_deployments" --jq '[.[] | select(.environment.name == "release")] | length')
            if [ "$pending" -gt 0 ]; then echo "waiting=true" >> "$GITHUB_OUTPUT"; exit 0; fi
            sleep 5
          done
          echo "Release never requested approval"

      - name: Give the approver 1 minute
        if: steps.request.outputs.waiting == 'true'
        run: |
          # Check every 5 seconds and stop as soon as Release is no longer waiting (approved or rejected).
          for _ in $(seq 1 12); do
            sleep 5
            pending=$(gh api "$RUN/pending_deployments" --jq '[.[] | select(.environment.name == "release")] | length')
            if [ "$pending" -eq 0 ]; then echo "Release was approved in time"; exit 0; fi
          done
          echo "::warning title=Release approval timed out::Not approved within 1 minute. To release later, open this run and click 'Re-run failed jobs'."
          echo "### Release approval timed out" >> "$GITHUB_STEP_SUMMARY"
          echo "Open this run and click **Re-run failed jobs** to release later (no timeout on re-runs)." >> "$GITHUB_STEP_SUMMARY"
          gh api -X POST "$RUN/cancel" > /dev/null
