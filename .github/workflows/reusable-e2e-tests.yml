on:
  workflow_call:
    inputs:
      npm-package-fullname:
        required: true
        type: string
      experimental:
        required: false
        type: boolean
        default: false
      os:
        required: true
        type: string
      # Set only one of these two inputs:
      node-version:
        required: false
        type: string
      node-version-file:
        required: false
        type: string

defaults:
  run:
    shell: bash

jobs:
  e2e-tests:
    runs-on: ${{ inputs.os }}
    continue-on-error: ${{ inputs.experimental }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # required by Log4brains to work correctly (needs the whole Git history)
      # Windows: npm's cache and global folder default to C:, where unpacking packages is ~8x slower than on D:
      - name: Put npm on the D drive (Windows)
        if: runner.os == 'Windows'
        run: |
          {
            echo "npm_config_cache=D:/npm-cache"
            echo "npm_config_prefix=D:/npm-prefix"
          } >> "$GITHUB_ENV"
          echo "D:/npm-prefix" >> "$GITHUB_PATH"
      - uses: actions/setup-node@v7
        with:
          node-version-file: ${{ inputs.node-version-file }}
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: e2e-tests/package-lock.json

      # But we do install log4brains from the registry
      - run: npm install -g ${{ inputs.npm-package-fullname }}

      - name: E2E Tests on the registry version
        run: npm run e2e
