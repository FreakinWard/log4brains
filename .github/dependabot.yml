version: 2
updates:
  - package-ecosystem: npm
    directories:
      - "/"
      - "/e2e-tests"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR per week for all non-breaking updates
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Major upgrades of the web stack are planned steps (MAINTENANCE_PLAN.md)
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "markdown-to-jsx"
        update-types: ["version-update:semver-major"]
      # Until eslint-plugin-react and eslint-plugin-import support ESLint 10
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 drops the compiler API used by typescript-eslint and Next.js
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # Matches the oldest supported Node.js version (engines)
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Must match cheerio's version (core uses its node types)
      - dependency-name: "domhandler"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
