sonar.organization=freakinward
sonar.projectKey=FreakinWard_log4brains
sonar.projectName=log4brains

# Scanner CLI 8's automatic scope analyzes the whole repository and ignores sonar.sources/sonar.tests,
# so tests, mocks and configuration files would count as production code. Use the explicit scope below.
sonar.scanner.autoconfig.enabled=false

# Production code only
sonar.sources=packages/core/src,packages/cli-common/src,packages/cli/src,packages/init/src,packages/global-cli/src,packages/web/cli,packages/web/nextjs/src
sonar.exclusions=**/*.test.ts,**/*.test.tsx,**/__snapshots__/**,**/__mocks__/**,**/mocks/**,**/*.stories.tsx

# Test code: unit tests next to the sources, and the integration/dev test folders
sonar.tests=packages/core/src,packages/core/integration-tests,packages/cli-common/dev-tests,packages/init/integration-tests,packages/web/nextjs/src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,packages/core/integration-tests/**,packages/cli-common/dev-tests/**,packages/init/integration-tests/**

# Reports generated by the CI workflow (reusable-sonarcloud.yml)
sonar.javascript.lcov.reportPaths=packages/core/coverage/lcov.info,packages/web/nextjs/coverage/lcov.info
sonar.testExecutionReportPaths=packages/core/coverage/jest-sonar.xml,packages/web/coverage/jest-sonar.xml
